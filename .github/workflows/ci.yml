name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'docs/**', '**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Commit lockfile on first run (pins every transitive dependency)
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain package-lock.json)" ]; then
            git config user.name "heymariner-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: add package-lock.json [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::could not push lockfile"
          fi
      - name: Validate content bank
        run: npm run pipeline -- validate
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck

  studio:
    # Next.js preview tool. Informational: it never blocks the video pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: apps/studio
      - run: npm run build
        working-directory: apps/studio
