name: Research

# Hourly HH:22 discovery scan (scan != publish). Pulls, de-duplicates and scores maritime sources. Free: no LLM, no rendering.
on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heymariner-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx@4.19.4 src/pipeline/cli.ts research
      - name: Save research
        run: |
          git config user.name "heymariner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/save-state.mjs "research: update scored topics [skip ci]" data/research
