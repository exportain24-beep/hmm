name: Research

# Pulls and scores maritime sources. Free: no LLM, no rendering.
on:
  schedule:
    - cron: '43 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heymariner-research
  cancel-in-progress: true

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes tsx@4.19.4 src/pipeline/cli.ts research
      - name: Save research
        run: |
          git config user.name "heymariner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          if ! git diff --cached --quiet; then
            git commit -m "research: update scored topics [skip ci]"
            for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break || sleep 5; done
          fi
