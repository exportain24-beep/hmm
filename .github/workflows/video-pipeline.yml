name: Video pipeline

# research -> plan -> script -> ElevenLabs voice -> Remotion/Three.js render -> QC -> metadata -> publish
# Scheduled runs do nothing until the repository variable PIPELINE_ENABLED is "true".
# Slot times live in config/schedule.json (the hourly wake-up only asks "is a slot due?").

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      tick:
        description: 'Scheduler tick: behave exactly like the hourly cron (schedule gate, runtime switches)'
        type: boolean
        default: false
      content_id:
        description: 'Spec id from content/bank or content/queue (empty = let the planner choose)'
        required: false
        default: ''
      slot:
        description: 'Schedule slot to simulate (morning / midday / evening, empty = none)'
        required: false
        default: ''
      dry_run:
        description: 'DRY_RUN: render everything, publish nothing'
        type: boolean
        default: true
      auto_publish:
        description: 'AUTO_PUBLISH (only used when dry_run is off)'
        type: boolean
        default: false
      preview_branch:
        description: 'Also push the video + review sheet to a throw-away branch preview/<id> (delete it after viewing)'
        type: boolean
        default: false
      platforms:
        description: 'Limit publishing to these platforms (comma separated, empty = all enabled)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: heymariner-video-pipeline
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
      slot: ${{ steps.decide.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the latest state (a run that just finished may have pushed it after this checkout)
        run: git fetch -q origin "${GITHUB_REF_NAME}" && git checkout "origin/${GITHUB_REF_NAME}" -- data/state && echo "state from $(git rev-parse --short origin/${GITHUB_REF_NAME})"
      - id: decide
        env:
          PIPELINE_ENABLED: ${{ vars.PIPELINE_ENABLED }}
          EVENT: ${{ github.event_name }}
          INPUT_SLOT: ${{ inputs.slot }}
          TICK: ${{ inputs.tick }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$TICK" != "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "slot=$INPUT_SLOT" >> "$GITHUB_OUTPUT"; exit 0
          fi
          npx --yes tsx@4.19.4 src/pipeline/cli.ts due
          SLOT=$(grep '^slot=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ -n "$SLOT" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

  produce:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && format('{0}', inputs.dry_run) || vars.DRY_RUN }}
      AUTO_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && !inputs.tick && format('{0}', inputs.auto_publish) || vars.AUTO_PUBLISH }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_VOICE_ID_NEWS: ${{ vars.ELEVENLABS_VOICE_ID_NEWS }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
      BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
      BUFFER_CHANNEL_TIKTOK: ${{ vars.BUFFER_CHANNEL_TIKTOK }}
      BUFFER_CHANNEL_LINKEDIN: ${{ vars.BUFFER_CHANNEL_LINKEDIN }}
      BUFFER_CHANNEL_X: ${{ vars.BUFFER_CHANNEL_X }}
      MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: System packages (ffmpeg + Chrome libraries)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 || sudo apt-get install -y -qq ffmpeg
          pip install -q -r tools/audio/requirements.txt
      - name: Cache npm + Remotion browser
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules/.remotion
          key: deps-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npx remotion browser ensure
      - name: Voice cache (re-runs never pay for the same narration twice)
        uses: actions/cache@v4
        with:
          path: .cache/voice
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - name: Load the latest state (a run that just finished may have pushed it after this checkout)
        run: git fetch -q origin "${GITHUB_REF_NAME}" && git checkout "origin/${GITHUB_REF_NAME}" -- data/state && echo "state from $(git rev-parse --short origin/${GITHUB_REF_NAME})"
      - name: Run pipeline
        env:
          CONTENT_ID: ${{ inputs.content_id }}
          SLOT: ${{ needs.gate.outputs.slot }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          ARGS=""
          [ -n "$CONTENT_ID" ] && ARGS="$ARGS --id $CONTENT_ID"
          [ -n "$SLOT" ] && ARGS="$ARGS --slot $SLOT"
          [ -n "$PLATFORMS" ] && ARGS="$ARGS --platforms $PLATFORMS"
          echo "DRY_RUN=$DRY_RUN AUTO_PUBLISH=$AUTO_PUBLISH"
          npm run pipeline -- run $ARGS
      - name: Upload video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heymariner-video-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
      - name: Push preview branch
        if: always() && inputs.preview_branch && hashFiles('out/**/final.mp4') != ''
        run: |
          ID=$(ls out | head -1)
          rm -rf /tmp/preview && mkdir -p /tmp/preview && cp out/$ID/* /tmp/preview/
          cd /tmp/preview
          ffmpeg -y -loglevel error -i final.mp4 -c:v libx264 -crf 26 -preset fast -c:a aac -b:a 128k -movflags +faststart share.mp4 && rm final.mp4
          git init -q -b "preview/$ID" && git config user.name "heymariner-bot" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "preview: $ID (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "preview/$ID"
      - name: Save state (published ids, fingerprints, slots, failures)
        if: always()
        run: |
          git config user.name "heymariner-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/save-state.mjs "state: pipeline run ${GITHUB_RUN_ID} [skip ci]" data/state content/queue
      - name: Clean temporary media
        if: always()
        run: rm -rf work out
